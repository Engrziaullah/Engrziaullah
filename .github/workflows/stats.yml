name: Generate GitHub Stats Panel

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_stats.py"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats.svg
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          mkdir -p out
          python3 .github/scripts/generate_stats.py out

      # crazy-max/ghaction-github-pages force-replaces the whole target
      # branch with a fresh orphan commit every run (keep_history: false),
      # and snake.yml publishes to this same "output" branch - without
      # this, whichever workflow runs last wipes the other's SVGs. Pull
      # the snake's current files in via the Contents API (not git fetch:
      # output has totally disjoint/orphan history each run, and shallow-
      # fetching a disjoint branch on top of the already-shallow main
      # checkout can silently fail to create the ref) so every push
      # carries both sets. Only accept non-empty downloads, so a bad
      # fetch never propagates a corrupt file forward.
      - name: Preserve existing snake SVGs on the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in snake-dark.svg snake-light.svg; do
            code=$(curl -sL -o "/tmp/$f" -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$f?ref=output")
            if [ "$code" = "200" ] && [ -s "/tmp/$f" ]; then
              mv "/tmp/$f" "out/$f"
            else
              rm -f "/tmp/$f"
            fi
          done

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: out
          commit_message: "Update stats panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
