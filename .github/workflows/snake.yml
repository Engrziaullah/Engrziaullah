name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Renders the contribution grid as a "snake" SVG, once per palette (light/dark),
      # colored to match the indigo/violet accent used across the rest of the profile.
      # First color_dots stop is the EMPTY cell: on dark it must be a visible slate
      # (#2d3343), not near-black - GitHub's own bg is #0d1117, so anything close to
      # black there reads as "grid is broken" rather than "no contributions that day".
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F8FAFC&color_dots=#2d3343,#312E81,#4338CA,#6366F1,#818CF8
            dist/snake-light.svg?color_snake=#1E1B4B&color_dots=#EEF2FF,#C7D2FE,#A5B4FC,#6366F1,#4F46E5

      # crazy-max/ghaction-github-pages force-replaces the whole target
      # branch with a fresh orphan commit every run (keep_history: false),
      # and stats.yml also publishes to this "output" branch - without
      # this, whichever workflow runs last wipes the other's SVGs. Pull
      # the stats panel's current files in via the Contents API (not git
      # fetch: output has totally disjoint/orphan history each run, and
      # shallow-fetching a disjoint branch on top of the already-shallow
      # main checkout can silently fail to create the ref) so every push
      # carries both sets. Only accept non-empty downloads, so a bad
      # fetch never propagates a corrupt file forward.
      - name: Preserve existing stats SVGs on the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in stats.svg stats-light.svg; do
            code=$(curl -sL -o "/tmp/$f" -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$f?ref=output")
            if [ "$code" = "200" ] && [ -s "/tmp/$f" ]; then
              mv "/tmp/$f" "dist/$f"
            else
              rm -f "/tmp/$f"
            fi
          done

      # Publishes dist/ to the "output" branch, so the SVGs are reachable at:
      # https://raw.githubusercontent.com/Engrziaullah/Engrziaullah/output/snake-dark.svg
      # https://raw.githubusercontent.com/Engrziaullah/Engrziaullah/output/snake-light.svg
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
